name: Deploy tracker
on:
  push:
    branches: [main]
    paths: ['site/**','data/**','scripts/**','.gitignore','.github/workflows/pages.yml']
  workflow_call:
    inputs:
      ref:
        description: Git ref to deploy
        required: false
        default: ''
        type: string
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build current Hiscores cache
        run: node scripts/tracker.mjs --hiscores-only
      - run: |
          mkdir -p _site
          cp -R site/. _site/
          cp -R data _site/data
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
